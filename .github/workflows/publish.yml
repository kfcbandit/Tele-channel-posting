name: MaritimeMonday publish

# Run this manually AFTER you're happy with the draft you received on Telegram.
# It rebuilds the same week's post and posts it to your channel.

on:
  workflow_dispatch: {}   # triggered by you from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish the saved draft to the channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python maritime_monday.py --publish

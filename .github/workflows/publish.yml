name: MaritimeMonday publish

# Posts the week's jobs straight to the channel. Runs automatically every Monday, and
# can also be triggered by hand. NOTE: automatic runs are NOT reviewed first — whatever
# the script builds goes live to TELEGRAM_CHANNEL_ID.

on:
  schedule:
    # 00:00 UTC on Mondays == 08:00 Singapore time (SGT = UTC+8). Same as the draft.
    # To change the time, convert your desired SGT time to UTC and edit below.
    - cron: "0 0 * * 1"
  workflow_dispatch: {}   # also lets you run it by hand from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish the saved draft to the channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python maritime_monday.py --publish
